name: Rust

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The full suite runs here and nowhere else by default: `check.ps1 -Mode all`
    # refuses without this, so an implementation agent cannot spend minutes
    # linking every target to prove a one-crate change.
    env:
      FFF_FULL_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      # zlob 1.8.0 declares a minimum zig of 0.17.1; an older one fails to build
      # with "@backingInt is not a builtin", so the version is pinned here too.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - uses: Swatinem/rust-cache@v2

      # fmt, clippy, the comment ratchet, then the whole suite.
      - name: check
        shell: pwsh
        run: ./tools/check.ps1 -Mode all
